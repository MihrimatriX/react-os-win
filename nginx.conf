server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate the entry page so a deploy never serves an old
    # index.html that points at hashed chunks the new image no longer has.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite's hashed bundles never change under the same name.
    # ^~ keeps the regex block below from taking these over.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Unhashed files from public/ (icons, wallpapers) can change between deploys.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 1d;
        try_files $uri =404;
    }
}
